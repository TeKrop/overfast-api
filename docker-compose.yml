# Long-lived services on the default json-file driver grow without bound; a
# full disk on the VPS takes down postgres and valkey together.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      target: ${BUILD_TARGET:-main}
    command: /code/.venv/bin/fastapi run app/main.py --port 8080 --proxy-headers
    env_file: ${APP_VOLUME_PATH:-.}/.env
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
    volumes:
      - static_volume:/code/static
      - ${APP_VOLUME_PATH:-/tmp}/app-logs:/code/logs
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://0.0.0.0:8080 || exit 1"]
      interval: 5s
      timeout: 5s

  worker:
    build:
      context: .
      target: ${BUILD_TARGET:-main}
    command: /code/.venv/bin/taskiq worker app.adapters.tasks.worker:broker --workers 1
    env_file: ${APP_VOLUME_PATH:-.}/.env
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
    ports:
      # Bind to loopback only — Caddy on the host fronts the public side.
      - "127.0.0.1:${PROMETHEUS_WORKER_PORT:-9091}:9091"
    volumes:
      - ${APP_VOLUME_PATH:-/tmp}/worker-logs:/code/logs
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'taskiq worker' || exit 1"]
      interval: 10s
      timeout: 5s

  scheduler:
    build:
      context: .
      target: ${BUILD_TARGET:-main}
    command: /code/.venv/bin/taskiq scheduler app.adapters.tasks.worker:scheduler
    env_file: ${APP_VOLUME_PATH:-.}/.env
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m
    volumes:
      - ${APP_VOLUME_PATH:-/tmp}/worker-logs:/code/logs
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'taskiq scheduler' || exit 1"]
      interval: 10s
      timeout: 5s

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-overfast}
      - POSTGRES_USER=${POSTGRES_USER:-overfast}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
    volumes:
      # Must be the PGDATA path itself: postgres:17 declares
      # VOLUME /var/lib/postgresql/data, which shadows a mount on the parent
      # with an anonymous volume — `docker compose down` then drops the cluster.
      # (Upstream mounts the parent because it runs postgres:18, where PGDATA moved up.)
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-overfast} -d ${POSTGRES_DB:-overfast}",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey:
    build:
      context: ./build/valkey
    command: sh -c "./entrypoint.sh"
    env_file: ${APP_VOLUME_PATH:-.}/.env
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${VALKEY_MEMORY_LIMIT:-1gb}
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 2s

  nginx:
    build:
      context: ./build/nginx
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
    ports:
      # Bind to loopback only — Caddy on the host fronts the public side.
      - "127.0.0.1:${APP_PORT}:80"
      - "127.0.0.1:${PROMETHEUS_NGINX_PORT:-9145}:9145"
    entrypoint: ["/entrypoint.sh"]
    env_file: ${APP_VOLUME_PATH:-.}/.env
    volumes:
      - static_volume:/static
    depends_on:
      app:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost || exit 1"]
      interval: 5s
      timeout: 2s

  reverse-proxy:
    profiles:
      - testing
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./build/reverse-proxy/default.conf:/etc/nginx/conf.d/default.conf
      - ./build/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      nginx:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost || exit 1"]
      interval: 5s
      timeout: 2s

  valkey-exporter:
    profiles:
      - monitoring
      - prometheus
    image: oliver006/redis_exporter:v1.90.0-alpine
    environment:
      - REDIS_ADDR=valkey:6379
    ports:
      # Bind to loopback only — exporters expose unauthenticated internals.
      - "127.0.0.1:${VALKEY_EXPORTER_PORT:-9121}:9121"
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://localhost:9121/metrics",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  postgres-exporter:
    profiles:
      - monitoring
      - prometheus
    image: prometheuscommunity/postgres-exporter:v0.20.1
    command: ["--config.file="]
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-overfast}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-overfast}?sslmode=disable
    ports:
      # Bind to loopback only — exporters expose unauthenticated internals.
      - "127.0.0.1:${POSTGRES_EXPORTER_PORT:-9187}:9187"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    profiles:
      - monitoring
      - prometheus
    image: prom/prometheus:v3.14.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./build/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      # Bind to loopback only — Prometheus has no authentication.
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - nginx
      - app
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    profiles:
      - monitoring
      - grafana
    image: grafana/grafana:13.2.0
    volumes:
      - ./build/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    ports:
      # Bind to loopback only — front it with Caddy if it needs to be public.
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_SERVER_ROOT_URL=${GRAFANA_SERVER_ROOT_URL:-%(protocol)s://%(domain)s:%(http_port)s/}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  static_volume:
  valkey-data:
  pg-data:
  prometheus-data:
  grafana-data:
