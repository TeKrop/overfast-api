name: "Release & Deploy"

# Triggered by human pushes to main (e.g. PR merges) — runs semantic-release,
# smoke tests, and then deploys to the VPS. This is the only deploy path;
# workflow_dispatch allows a redeploy of current main without a code change
# (semantic-release simply finds nothing to release and the deploy proceeds).

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release with Python Semantic Release
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Setup | Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Action | Semantic Version Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

  smoke-test:
    name: Smoke test (Docker)
    needs: release
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run smoke test
        run: bash scripts/smoke-test.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

  deploy:
    name: Deploy on VPS
    needs: [release, smoke-test]
    if: |
      github.actor != 'github-actions[bot]'
      && needs.release.result == 'success'
      && needs.smoke-test.result == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: "10m"
          script: |
            /opt/deploy-overfast.sh

      - name: Post-deploy health check
        run: |
          set -euo pipefail
          BASE_URL="https://api.mercy-stats.app"
          MAX_ATTEMPTS=20
          INTERVAL=6
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            CODE=$(curl -sk -o /tmp/health.json -w "%{http_code}" \
              --max-time 10 --compressed "$BASE_URL/roles" || echo "000")
            if [ "$CODE" = "200" ] && jq -e '.[0].key' /tmp/health.json >/dev/null 2>&1; then
              echo "Health check OK after attempt $i."
              exit 0
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: HTTP $CODE — retrying in ${INTERVAL}s..."
            sleep "$INTERVAL"
          done
          echo "::error::Post-deploy health check failed after $MAX_ATTEMPTS attempts."
          exit 1
