name: "Build"

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: ruff, ty & pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install the project
        run: uv sync --frozen

      - name: Run ruff code analysis
        run: uv run ruff check .

      - name: Run ty code analysis
        run: uv run ty check .

      - name: Run tests suite
        # postgres_password is the only Settings field without a default, and
        # app/config.py instantiates Settings at import time, so pytest fails
        # during conftest collection without it.
        env:
          POSTGRES_PASSWORD: ci-test-password
        run: |
          PYTHONPATH=app/ uv run python -m pytest -v --cov-fail-under=80 --cov-report=term-missing --cov=app/ tests/
