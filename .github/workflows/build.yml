name: "Build"

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: ruff, ty & pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install the project
        run: uv sync --frozen

      - name: Run ruff code analysis
        run: uv run ruff check .

      - name: Run ty code analysis
        run: uv run ty check .

      - name: Run tests suite
        # postgres_password is the only Settings field without a default, and
        # app/config.py instantiates Settings at import time, so pytest fails
        # during conftest collection without it.
        env:
          POSTGRES_PASSWORD: ci-test-password
        run: |
          PYTHONPATH=app/ uv run python -m pytest -v --cov-fail-under=80 --cov-report=term-missing --cov=app/ tests/

  smoke-test:
    name: Smoke test (Docker)
    runs-on: ubuntu-latest

    # Runs the same script as the deploy gate in release.yaml. Without it a PR
    # can be green on unit tests and still break the compose stack, which is
    # only discovered after the merge to main has already triggered a deploy.
    steps:
      - uses: actions/checkout@v7

      - name: Run smoke test
        run: bash scripts/smoke-test.sh

      # The smoke test only reads static endpoints, so it stayed green while
      # the cluster was written to a throwaway anonymous volume. This asserts
      # the database actually survives a container lifecycle.
      - name: Run persistence test
        run: bash scripts/persistence-test.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200
