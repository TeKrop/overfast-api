name: "Add SSH key (one-shot)"

# Recovery workflow: uses the working CI deploy key to append a new public key
# to the VPS user's authorized_keys. Delete this file once access is restored.

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: "Public key line to append (ssh-ed25519 AAAA... comment)"
        required: true
        type: string

jobs:
  add-key:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Append key via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: NEW_KEY
          script: |
            set -euo pipefail
            echo "Connected as $(whoami) on $(hostname)"
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
            if grep -qxF "$NEW_KEY" ~/.ssh/authorized_keys; then
              echo "Key already present."
            else
              echo "$NEW_KEY" >> ~/.ssh/authorized_keys
              echo "Key appended."
            fi
            echo "--- authorized_keys fingerprints ---"
            ssh-keygen -lf ~/.ssh/authorized_keys
        env:
          NEW_KEY: ${{ inputs.public_key }}
