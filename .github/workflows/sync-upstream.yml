name: "Sync Upstream & Deploy"

permissions:
  contents: write

on:
  schedule:
    # Daily at 04:00 UTC — picks up new upstream releases automatically.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy current main even if no upstream updates"
        required: false
        default: false
        type: boolean

# Only one sync run at a time. Don't cancel — let the running one finish
# so we never push a half-validated state.
concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: TeKrop/overfast-api
  UPSTREAM_BRANCH: main

jobs:
  # ── Stage 1: Stage merge locally; do NOT push yet. ───────────────────────────
  merge-staging:
    name: Merge upstream (staging)
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure merge drivers
        run: |
          git config merge.accept-upstream.name "Accept upstream version"
          git config merge.accept-upstream.driver "cp '%B' '%A'"
          git config merge.keep-fork.name "Keep fork version"
          git config merge.keep-fork.driver true

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || true
          # --no-tags: upstream version tags often clash with already-fetched
          # ones on origin and a clobber rejection trips set -e. We only need
          # the branch SHA for the merge.
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Check for upstream updates
        id: check
        run: |
          set -euo pipefail
          UPSTREAM_SHA=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"

          NEW_COMMITS=$(git log "HEAD..${UPSTREAM_SHA}" --oneline)
          if [ -n "$NEW_COMMITS" ]; then
            echo "New upstream commits found:"
            echo "$NEW_COMMITS"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new commits from upstream (upstream at $UPSTREAM_SHA)"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream locally
        if: steps.check.outputs.has_updates == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.check.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          # --no-commit so the workflow prune folds into the merge commit and
          # resolves modify/delete conflicts on workflows we drop anyway
          # (upstream modifies a workflow file this fork has deleted).
          git merge --no-ff --no-commit "$UPSTREAM_SHA" || true
          ./scripts/prune-unmanaged-workflows.sh
          # Any conflict surviving the prune is a real one — fail loudly.
          if git ls-files -u | grep -q .; then
            echo "Unresolved merge conflicts remain:"
            git ls-files -u
            exit 1
          fi
          git commit --no-edit -m "chore: merge upstream changes"

      - name: Archive merged repository
        if: steps.check.outputs.has_updates == 'true'
        run: tar czf /tmp/merged-repo.tar.gz .

      - name: Upload merged repo artifact
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: merged-repo
          path: /tmp/merged-repo.tar.gz
          retention-days: 1

  # ── Stage 2a: Lint & test (parallel with smoke-test). ────────────────────────
  ci-checks:
    name: CI checks (ruff, ty, pytest)
    needs: merge-staging
    if: needs.merge-staging.outputs.has_updates == 'true' || github.event.inputs.force_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download merged repo
        if: needs.merge-staging.outputs.has_updates == 'true'
        uses: actions/download-artifact@v8
        with:
          name: merged-repo

      - name: Extract archive
        if: needs.merge-staging.outputs.has_updates == 'true'
        run: tar xzf merged-repo.tar.gz && rm merged-repo.tar.gz

      - name: Checkout current main
        if: needs.merge-staging.outputs.has_updates != 'true'
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install the project
        run: uv sync --frozen

      - name: Run ruff code analysis
        run: uv run ruff check .

      - name: Run ty code analysis
        run: uv run ty check .

      - name: Run test suite
        # postgres_password is the only Settings field without a default;
        # pytest instantiates Settings on import, so it must be present.
        env:
          POSTGRES_PASSWORD: ci-test-password
        run: |
          PYTHONPATH=app/ uv run python -m pytest -v --cov-fail-under=80 --cov-report=term-missing --cov=app/ tests/

  # ── Stage 2b: Docker smoke test (parallel with ci-checks). ───────────────────
  smoke-test:
    name: Smoke test (Docker)
    needs: merge-staging
    if: needs.merge-staging.outputs.has_updates == 'true' || github.event.inputs.force_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download merged repo
        if: needs.merge-staging.outputs.has_updates == 'true'
        uses: actions/download-artifact@v8
        with:
          name: merged-repo

      - name: Extract archive
        if: needs.merge-staging.outputs.has_updates == 'true'
        run: tar xzf merged-repo.tar.gz && rm merged-repo.tar.gz

      - name: Checkout current main
        if: needs.merge-staging.outputs.has_updates != 'true'
        uses: actions/checkout@v7

      - name: Run smoke test
        run: bash scripts/smoke-test.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

  # ── Stage 3: Push the validated merge to main. ───────────────────────────────
  # Re-merges deterministically using the SHA captured in merge-staging so
  # the pushed tree matches the one we tested.
  commit-to-main:
    name: Push to main
    needs: [merge-staging, ci-checks, smoke-test]
    if: |
      needs.merge-staging.outputs.has_updates == 'true'
      && needs.ci-checks.result == 'success'
      && needs.smoke-test.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure merge drivers
        run: |
          git config merge.accept-upstream.name "Accept upstream version"
          git config merge.accept-upstream.driver "cp '%B' '%A'"
          git config merge.keep-fork.name "Keep fork version"
          git config merge.keep-fork.driver true

      - name: Merge validated upstream SHA and push
        env:
          UPSTREAM_SHA: ${{ needs.merge-staging.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || true
          git fetch upstream "${UPSTREAM_BRANCH}"
          # Re-fetch origin in case other commits landed on main while we tested.
          git fetch origin "${UPSTREAM_BRANCH}"
          git reset --hard "origin/${UPSTREAM_BRANCH}"

          # Already merged? (e.g. another sync raced us). Nothing to do.
          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "origin/main already contains $UPSTREAM_SHA; nothing to push."
            exit 0
          fi

          # --no-commit so the workflow prune folds into the merge commit and
          # resolves modify/delete conflicts on workflows we drop anyway.
          git merge --no-ff --no-commit "$UPSTREAM_SHA" || true
          ./scripts/prune-unmanaged-workflows.sh
          if git ls-files -u | grep -q .; then
            echo "Unresolved merge conflicts remain:"
            git ls-files -u
            exit 1
          fi
          git commit --no-edit -m "chore: merge upstream changes"
          git push origin "${UPSTREAM_BRANCH}"
          echo "Merge commit pushed to main."

  # ── Stage 4: Deploy. Only runs when validation gates passed. ─────────────────
  deploy:
    name: Deploy to VPS
    needs: [merge-staging, ci-checks, smoke-test, commit-to-main]
    if: |
      always()
      && needs.ci-checks.result == 'success'
      && needs.smoke-test.result == 'success'
      && (
        needs.commit-to-main.result == 'success'
        || (github.event.inputs.force_deploy == 'true' && needs.merge-staging.outputs.has_updates != 'true')
      )
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: "10m"
          script: |
            /opt/deploy-overfast.sh

      - name: Post-deploy health check
        run: |
          set -euo pipefail
          BASE_URL="https://api.mercy-stats.app"
          MAX_ATTEMPTS=20
          INTERVAL=6

          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            CODE=$(curl -sk -o /tmp/health.json -w "%{http_code}" \
              --max-time 10 --compressed "$BASE_URL/roles" || echo "000")
            if [ "$CODE" = "200" ] && jq -e '.[0].key' /tmp/health.json >/dev/null 2>&1; then
              echo "Health check OK after attempt $i."
              exit 0
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: HTTP $CODE — retrying in ${INTERVAL}s..."
            sleep "$INTERVAL"
          done
          echo "::error::Post-deploy health check failed after $MAX_ATTEMPTS attempts."
          exit 1

      - name: Notify overwatch_app to sync API models
        if: success()
        continue-on-error: true
        env:
          APP_REPO_PAT: ${{ secrets.APP_REPO_PAT }}
        run: |
          if [ -z "${APP_REPO_PAT:-}" ]; then
            echo "::warning::APP_REPO_PAT not configured; skipping cross-repo notify."
            exit 0
          fi
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${APP_REPO_PAT}" \
            https://api.github.com/repos/smart-app-solutions/overwatch_app/dispatches \
            -d '{"event_type":"api-updated"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "204" ]; then
            echo "::warning::overwatch_app notify failed (HTTP $HTTP_CODE) — likely an expired PAT. Deployment is still considered successful."
            exit 0
          fi
          echo "Dispatched api-updated event to overwatch_app."
