default_language_version:
  python: python3.15
repos:
  - repo: local
    hooks:
      - id: ruff
        name: (ruff) Linting and fixing code
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: (ruff) Formatting code
        entry: uv run ruff format
        language: system
        pass_filenames: false
        always_run: true
      - id: pyrefly
        name: (pyrefly) Type checking code
        entry: uv run pyrefly check
        language: system
        pass_filenames: false
        always_run: true
      - id: import-linter
        name: (import-linter) Checking architecture contracts
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true
